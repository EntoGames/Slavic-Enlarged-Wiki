<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Paradox King Script";
    src: url("/fonts/ParadoxKingScript.ttf") format("truetype");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1c2214; }

  .card {
    width: 1920px; height: 1080px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .bg-map {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.05);
    z-index: 0;
  }
  /* lekki desat ku ciepłemu, by mapa nie krzyczała pod tekstem */
  .bg-tone { position: absolute; inset: 0; z-index: 1;
    background: rgba(28,34,20,0.30); mix-blend-mode: multiply; }

  .overlay-gradient {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(180deg,
      rgba(28,34,20,0.82) 0%,
      rgba(28,34,20,0.42) 22%,
      rgba(28,34,20,0.30) 50%,
      rgba(28,34,20,0.48) 74%,
      rgba(28,34,20,0.88) 100%);
  }
  .vignette {
    position: absolute; inset: 0; z-index: 3;
    background: radial-gradient(ellipse at center, transparent 12%, rgba(0,0,0,0.62) 100%);
  }
  .smoke-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 42%; z-index: 3;
    background: linear-gradient(to top, rgba(28,34,20,0.92) 0%, rgba(28,34,20,0.5) 35%, transparent 100%);
  }
  .smoke-top {
    position: absolute; top: 0; left: 0; right: 0; height: 26%; z-index: 3;
    background: linear-gradient(to bottom, rgba(28,34,20,0.8) 0%, transparent 100%);
  }

  .brand-row {
    position: absolute; top: 88px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 26px; z-index: 5;
    filter: drop-shadow(0 3px 10px #1c2214) drop-shadow(0 8px 24px #1c2214);
  }
  .brand-row .wordmark { height: 64px; width: auto; filter: brightness(0) invert(1); opacity: 0.92; }

  .content {
    position: relative; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    text-align: center; padding: 0 120px;
    filter: drop-shadow(0 3px 12px rgba(28,34,20,1)) drop-shadow(0 10px 34px rgba(28,34,20,1));
  }

  .kicker {
    font-family: "Paradox King Script", serif;
    font-size: 48px; letter-spacing: 0.28em;
    color: rgba(197,160,72,0.88);
    text-transform: uppercase; line-height: 1;
    margin-bottom: 26px;
  }

  .headline {
    font-family: "Paradox King Script", serif;
    font-size: 190px; letter-spacing: 0.05em;
    background: linear-gradient(180deg, #f5e0a0 0%, #c5a048 46%, #8a6d30 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.02; font-weight: 400;
  }
  .headline.rubric {
    background: none; -webkit-text-fill-color: initial;
    color: #b3402f;
    text-shadow: 0 4px 18px rgba(0,0,0,0.55);
  }

  .subtitle {
    font-family: "Paradox King Script", serif;
    font-size: 52px; letter-spacing: 0.26em;
    color: rgba(255,255,255,0.92);
    text-transform: uppercase; line-height: 1.1;
    margin-top: 34px;
  }

  /* divider: cienka linia + złoty romb (manuskryptowy akcent) */
  .divider { display: flex; align-items: center; justify-content: center; gap: 22px;
    margin-top: 40px; z-index: 5; }
  .divider .rule { width: 220px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(197,160,72,0.8), transparent); }
  .divider .gem { width: 14px; height: 14px; background: #e4ac42; transform: rotate(45deg); }

  .badge {
    position: absolute; bottom: 64px; left: 0; right: 0; text-align: center; z-index: 5;
    font-family: "Lato", "Helvetica", sans-serif;
    font-size: 26px; letter-spacing: 0.18em;
    color: rgba(197,160,72,0.6);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg-map" id="bgMap"></div>
  <div class="bg-tone"></div>
  <div class="overlay-gradient"></div>
  <div class="smoke-top"></div>
  <div class="smoke-bottom"></div>
  <div class="vignette"></div>

  <div class="brand-row" id="brandRow">

          <stop offset="0%" stop-color="#B89A5A"/><stop offset="30%" stop-color="#A88845"/>
          <stop offset="55%" stop-color="#8E7638"/><stop offset="82%" stop-color="#6A5020"/>
          <stop offset="100%" stop-color="#806735"/>
        </linearGradient>
      </defs>

    </svg>
    <img class="wordmark" src="/logo/slavic-enlarged-wordmark.svg" alt="Slavic Enlarged">
  </div>

  <div class="content">
    <p class="kicker" id="kicker">BEFORE THE SAINTS</p>
    <p class="headline" id="headline">THE THUNDER</p>
    <div class="divider" id="divider"><div class="rule"></div><div class="gem"></div><div class="rule"></div></div>
    <p class="subtitle" id="subtitle"></p>
  </div>

  <span class="badge" id="badge">Slavic Enlarged &middot; Crusader Kings III</span>
</div>

<script>
const p = new URLSearchParams(location.search);
const map = p.get('map') || '';
if (map) document.getElementById('bgMap').style.backgroundImage = `url(/marketing/${map})`;

function setText(id, key, hideIfEmpty) {
  const v = p.get(key);
  const el = document.getElementById(id);
  if (v === null) return;
  if (v === '' && hideIfEmpty) { el.style.display = 'none'; return; }
  el.textContent = v;
}
setText('kicker', 'kicker', true);
setText('headline', 'headline', false);
setText('subtitle', 'sub', true);
setText('badge', 'badge', true);

const hl = document.getElementById('headline');
if (p.get('fs')) hl.style.fontSize = p.get('fs') + 'px';
if (p.get('rubric') === '1') hl.classList.add('rubric');
if (p.get('kfs')) document.getElementById('kicker').style.fontSize = p.get('kfs') + 'px';
const st = document.getElementById('subtitle');
if (p.get('sfs')) st.style.fontSize = p.get('sfs') + 'px';
if (p.get('sls')) st.style.letterSpacing = p.get('sls') + 'em';

// divider tylko gdy jest subtitle
if (!p.get('sub')) document.getElementById('divider').style.display = 'none';
// brand-row można schować na planszy tytułowej (logo i tak jest headline'em)
if (p.get('brand') === '0') document.getElementById('brandRow').style.display = 'none';
</script>
</body>
</html>
