<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Paradox King Script";
    src: url("/fonts/ParadoxKingScript.ttf") format("truetype");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 512px; height: 512px; overflow: hidden; background: #1c2214; }

  .cover {
    width: 512px; height: 512px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }

  .cover .bg-map {
    position: absolute; inset: 0;
    background: url('ChatGPT Image 15 cze 2026, 18_37_21.png') center/cover;
    z-index: 0;
    filter: sepia(0.55) brightness(0.76) saturate(0.8) contrast(1.08);
  }

  .cover .overlay-gradient {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg,
      rgba(28,34,20,0.75) 0%,
      rgba(28,34,20,0.3) 25%,
      rgba(28,34,20,0.12) 45%,
      rgba(28,34,20,0.12) 55%,
      rgba(28,34,20,0.35) 75%,
      rgba(28,34,20,0.8) 100%);
  }

  .cover .vignette {
    position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 15%, rgba(0,0,0,0.85) 100%);
  }

  .cover .smoke-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40%; z-index: 2;
    background: linear-gradient(to top, rgba(28,34,20,0.9) 0%, rgba(28,34,20,0.5) 35%, transparent 100%);
  }

  .cover .smoke-top {
    position: absolute; top: 0; left: 0; right: 0; height: 25%; z-index: 2;
    background: linear-gradient(to bottom, rgba(28,34,20,0.75) 0%, transparent 100%);
  }

  .cover .content {
    position: relative; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    filter:
      drop-shadow(0 2px 6px rgba(28,34,20,1))
      drop-shadow(0 6px 20px rgba(28,34,20,1))
      drop-shadow(0 12px 40px rgba(28,34,20,0.95))
      drop-shadow(0 20px 60px rgba(28,34,20,0.85));
  }

  .brand-row {
    display: flex; align-items: center; gap: 12px; z-index: 3;
    filter:
      drop-shadow(0 2px 6px #1c2214)
      drop-shadow(0 6px 18px #1c2214)
      drop-shadow(0 14px 36px rgba(28,34,20,0.9));
    margin-bottom: 14px;
  }

  .brand-wordmark {
    font-family: "Paradox King Script", serif;
    font-size: 15px; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.9);
    text-transform: uppercase;
  }

  .top-label {
    font-family: "Paradox King Script", serif;
    font-size: 20px; letter-spacing: 0.2em;
    color: rgba(255,255,255,0.95);
    text-transform: uppercase; line-height: 1;
  }

  .main-title {
    font-family: "Paradox King Script", serif;
    font-size: 64px; letter-spacing: 0.06em; line-height: 1;
    background: linear-gradient(180deg, #f5e0a0 0%, #c5a048 45%, #8a6d30 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center; padding: 0 12px;
    margin: 0; font-weight: 400;
  }

  .main-title-bottom {
    margin-top: -14px;
  }

  .subtitle {
    font-family: "Paradox King Script", serif;
    font-size: 20px; letter-spacing: 0.2em;
    color: rgba(255,255,255,0.95);
    text-transform: uppercase; line-height: 1;
    margin-top: 4px;
  }

  .badge {
    position: absolute; bottom: 24px; z-index: 3;
    font-family: "Paradox King Script", serif;
    font-size: 11px; letter-spacing: 0.25em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    filter:
      drop-shadow(0 2px 6px rgba(28,34,20,1))
      drop-shadow(0 4px 14px rgba(28,34,20,1));
  }
</style>
</head>
<body>

    <p class="subtitle">Slavic Papacy</p>
  </div>

</div>

</html>
