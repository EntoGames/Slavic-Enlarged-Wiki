<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1608"/>
      <stop offset="100%" stop-color="#2a2210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2C379"/>
      <stop offset="100%" stop-color="#C5A048"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="16" y="16" width="480" height="480" rx="8" fill="none" stroke="#C5A048" stroke-width="1.5" opacity="0.3"/>
  <rect x="24" y="24" width="464" height="464" rx="4" fill="none" stroke="#C5A048" stroke-width="0.5" opacity="0.15"/>
  <!-- Legend symbol — open book with flame -->
  <g transform="translate(256,195)" filter="url(#glow)" opacity="0.85">
    <path d="M-30 15 Q-30 -15 0 -25 Q30 -15 30 15 L30 30 Q0 20 -30 30 Z" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <line x1="0" y1="-25" x2="0" y2="30" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
    <path d="M0 -35 Q-5 -50 0 -60 Q5 -50 0 -35" fill="#C5A048" opacity="0.7"/>
    <circle cx="0" cy="-60" r="3" fill="#E2C379" opacity="0.6"/>
  </g>
  <!-- Title -->
  <text x="256" y="305" text-anchor="middle" font-family="serif" font-size="28" fill="#C5A048" letter-spacing="0.1em">MYTHS</text>
  <text x="256" y="345" text-anchor="middle" font-family="serif" font-size="22" fill="#E2C379" letter-spacing="0.15em" opacity="0.8">&amp;</text>
  <text x="256" y="380" text-anchor="middle" font-family="serif" font-size="28" fill="#C5A048" letter-spacing="0.1em">LEGENDS</text>
  <!-- Subtitle -->
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#C5A048" opacity="0.4" letter-spacing="0.2em">SLAVIC ENLARGED ADDON</text>
  <!-- Placeholder notice -->
  <text x="256" y="475" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#C5A048" opacity="0.25" letter-spacing="0.15em">PLACEHOLDER — REPLACE WITH FINAL ART</text>
</svg>
