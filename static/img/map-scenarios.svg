<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800">
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="gn"/>
      <feComponentTransfer in="gn" result="dim">
        <feFuncR type="linear" slope="0.06"/>
        <feFuncG type="linear" slope="0.05"/>
        <feFuncB type="linear" slope="0.03"/>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feBlend mode="screen" in="SourceGraphic" in2="dim"/>
    </filter>
    <radialGradient id="vig" cx="40%" cy="42%" r="68%">
      <stop offset="0%" stop-color="rgba(42,36,24,0)"/>
      <stop offset="80%" stop-color="rgba(15,12,5,0.25)"/>
      <stop offset="100%" stop-color="rgba(6,4,1,0.55)"/>
